name: Release

# Push a tag like v2.0.0-alpha.4 to publish the package to pub.dev.
# The tag must match the version in pubspec.yaml and be on main.
# The CI tests run on the tag first. Nothing is published when they fail.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # All CI tests must pass on the tag before anything is published.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          v=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, pubspec $v"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag is not on main"; exit 1; }
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Publish to pub.dev
        run: dart pub publish --force
